<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Leaderboard')}"></head>
<body><nav th:replace="~{fragments :: topbar}"></nav>
<div class="p-3 container-xl"><h2 class="fw-bold">EcoSphere Leaderboard</h2><p class="text-muted">Verified plantations and EcoPoints earned through verified activities. Ranks update automatically after NGO verification.</p>
<div class="row g-3 mb-3"><div class="col-md-4" th:each="u,s:${board}" th:if="${s.index<3}"><div class="card-e text-center"><span class="tag" th:text="${s.index==0?'🥇 Grand Champion':(s.index==1?'🥈 Silver':'🥉 Bronze')}"></span>
<h4 class="fw-bold mt-2" th:text="${u.name}"></h4><small th:text="${u.location}"></small><div class="d-flex justify-content-around mt-3"><div><div class="lbl">GreenScore</div><b th:text="${u.greenScore}"></b></div><div><div class="lbl">EcoPoints</div><b th:text="${u.ecoPoints}"></b></div></div></div></div></div>
<div class="card-e"><table class="table align-middle"><tr class="lbl"><th>Rank</th><th>User</th><th>Location</th><th>GreenScore</th><th>EcoPoints</th></tr>
<tr th:each="u,s:${board}" th:classappend="${me!=null and u.id==me.id}?'table-success'"><td th:text="${s.count}"></td><td><b th:text="${u.name}"></b><span class="tag ms-1" th:if="${me!=null and u.id==me.id}">You</span></td><td th:text="${u.location}"></td><td th:text="${u.greenScore}"></td><td class="fw-bold text-success" th:text="${u.ecoPoints}"></td></tr></table>
<a th:href="@{/}" class="btn btn-outline-success btn-sm">← Back to dashboard</a></div></div></body></html>
