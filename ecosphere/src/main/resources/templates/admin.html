<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Admin')}"></head>
<body><nav th:replace="~{fragments :: topbar}"></nav><div th:replace="~{fragments :: flash}"></div>
<div class="p-3 container-xl"><div class="hero-card mb-3"><span class="tag">ADMIN</span><h2 class="fw-bold mb-0 mt-1" th:text="${me.name}"></h2></div>
<div class="row g-3 mb-3"><div class="col-md-4"><div class="card-e"><div class="lbl">Platform users</div><div class="kpi" th:text="${all.size()}"></div><small th:text="'Citizens: '+${nUsers}+' • NGO: '+${nNgo}+' • Nursery: '+${nNur}"></small></div></div>
<div class="col-md-4"><div class="card-e"><div class="lbl">Plantation submissions</div><div class="kpi" th:text="${subs}"></div><small th:text="'Pending: '+${pending}"></small></div></div>
<div class="col-md-4"><div class="card-e"><div class="lbl">Live nursery stock</div><div class="kpi" th:text="${stock}"></div></div></div></div>
<div class="card-e mb-3"><h5 class="fw-bold">System Configuration</h5><table class="table align-middle"><tr class="lbl"><th>Key</th><th>Value</th></tr>
<tr th:each="c:${configs}"><td th:text="${c.key}"></td><td><form th:action="@{/admin/config}" method="post" class="d-flex gap-2"><input type="hidden" name="key" th:value="${c.key}"><input name="value" th:value="${c.value}" class="form-control form-control-sm" style="max-width:200px"><button class="btn btn-sm btn-outline-success">update</button></form></td></tr></table>
<form th:action="@{/admin/config}" method="post" class="d-flex gap-2"><input name="key" class="form-control form-control-sm" placeholder="NEW_KEY" required><input name="value" class="form-control form-control-sm" placeholder="value" required><button class="btn btn-sm btn-eco">Add</button></form></div>
<div class="card-e"><h5 class="fw-bold">User Management Hierarchy</h5><div class="table-responsive"><table class="table align-middle"><tr class="lbl"><th>User</th><th>Role</th><th>Status</th><th>Registered</th><th>Actions</th></tr>
<tr th:each="u:${all}"><td><b th:text="${u.name}"></b><br><small class="text-muted" th:text="${u.email}"></small></td><td><span class="tag" th:text="${u.role}"></span></td><td><span class="tag" th:classappend="${u.status}" th:text="${u.status}"></span></td><td th:text="${#temporals.format(u.createdAt,'d MMM yyyy')}"></td>
<td th:if="${u.email!=me.email}"><form th:action="@{/admin/user/{id}/status(id=${u.id})}" method="post" class="d-flex gap-1"><input type="hidden" name="status" th:value="${u.status=='ACTIVE'}?'SUSPENDED':'ACTIVE'"><button class="btn btn-sm" th:classappend="${u.status=='PENDING'}?'btn-eco':'btn-outline-secondary'" th:text="${u.status=='PENDING'}?'Approve':(${u.status=='ACTIVE'}?'Suspend':'Restore')"></button></form></td><td th:unless="${u.email!=me.email}"><small class="text-muted">Root operator</small></td></tr></table></div></div></div></body></html>
