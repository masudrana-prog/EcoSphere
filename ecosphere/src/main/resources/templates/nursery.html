<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Nursery')}"></head>
<body><nav th:replace="~{fragments :: topbar}"></nav>
<div class="p-3 container-xl"><div class="hero-card mb-3"><h2 class="fw-bold mb-0" th:text="${me.name}"></h2><small th:text="${me.location}+' • '+${me.phone}"></small></div>
<div class="row g-3 mb-3"><div class="col-md-6"><div class="card-e"><div class="lbl">Total available saplings</div><div class="kpi" th:text="${units}"></div></div></div>
<div class="col-md-6"><div class="card-e"><div class="lbl">Tree / sapling types</div><div class="kpi" th:text="${trees.size()}"></div></div></div></div>
<div class="row g-3"><div class="col-lg-8"><div class="card-e"><h5 class="fw-bold">Nursery Catalog &amp; Sapling Stock</h5><div class="table-responsive"><table class="table align-middle"><tr class="lbl"><th>Species</th><th>Category</th><th>Price</th><th>Units</th><th>Status</th><th></th></tr>
<tr th:each="t:${trees}"><td><b th:text="${t.name}"></b><br><small class="text-muted" th:text="${t.scientificName}"></small></td><td><span class="tag" th:text="${t.category}"></span></td><td th:text="'৳'+${t.price}"></td>
<td><form th:action="@{/nursery/tree/{id}/stock(id=${t.id})}" method="post" class="d-flex gap-1"><input name="quantity" type="number" min="0" th:value="${t.quantity}" class="form-control form-control-sm" style="width:90px"><button class="btn btn-sm btn-outline-success">Update</button></form></td>
<td><span class="tag" th:classappend="${t.available}?'':'REJECTED'" th:text="${t.available}?'Available':'Out of stock'"></span> <span class="tag PENDING" th:if="${t.quantity>0 and t.quantity<100}">Low</span></td>
<td><form th:action="@{/nursery/tree/{id}/delete(id=${t.id})}" method="post" onsubmit="return confirm('Remove this tree?')"><button class="btn btn-sm text-danger">✕</button></form></td></tr></table></div></div></div>
<div class="col-lg-4"><div class="card-e"><h5 class="fw-bold">Add Tree</h5><form th:action="@{/nursery/tree}" method="post"><input name="name" class="form-control mb-2" placeholder="Species name" required><input name="scientificName" class="form-control mb-2" placeholder="Scientific name">
<input name="category" class="form-control mb-2" placeholder="Category" required><input name="price" type="number" step="0.01" min="0" class="form-control mb-2" placeholder="Unit price (৳)" required><input name="quantity" type="number" min="0" class="form-control mb-2" placeholder="Quantity" required><button class="btn btn-eco w-100">addTree</button></form></div></div></div><div class="card-e mt-3"><h5 class="fw-bold">Tree Orders <span class="tag PENDING" th:if="${pendingOrders>0}" th:text="${pendingOrders}+' pending'"></span></h5>
<div class="alert alert-success py-2" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
<div class="table-responsive"><table class="table align-middle small"><tr class="lbl"><th>Order</th><th>Buyer</th><th>Tree</th><th>Qty</th><th>Total</th><th>Delivery</th><th>Payment</th><th>Status</th><th>Action</th></tr>
<tr th:each="o:${orders}"><td th:text="'#'+${o.id}"></td><td><b th:text="${o.buyer.name}"></b><br><span class="text-muted" th:text="${o.phone}"></span></td><td th:text="${o.tree.name}"></td><td th:text="${o.quantity}"></td><td th:text="'৳'+${o.total}"></td><td th:text="${o.deliveryAddress}"></td><td><b th:text="${o.paymentMethod=='BKASH'}?'bKash':'Cash on delivery'"></b><div class="text-muted" th:if="${o.trxId}" th:text="'TrxID: '+${o.trxId}+' • from '+${o.bkashSender}"></div><div class="text-muted" th:if="${o.paymentMethod=='BKASH'}">Verify in your bKash app</div></td>
<td><span class="tag" th:classappend="${o.status=='PENDING'}?'PENDING':(${o.status=='CANCELLED'}?'REJECTED':'')" th:text="${o.status}"></span></td>
<td><form th:action="@{/nursery/orders/{id}/status(id=${o.id})}" method="post" class="d-flex gap-1" th:if="${o.status=='PENDING' or o.status=='CONFIRMED'}">
<button name="status" th:value="${o.status=='PENDING'}?'CONFIRMED':'DELIVERED'" class="btn btn-sm btn-eco" th:text="${o.status=='PENDING'}?'Confirm':'Mark delivered'"></button>
<button name="status" value="CANCELLED" class="btn btn-sm btn-outline-danger" onclick="return confirm('Cancel this order? Stock will be restored.')">Cancel</button></form></td></tr>
<tr th:if="${orders.isEmpty()}"><td colspan="9" class="text-muted">No orders yet.</td></tr></table></div></div></div></body></html>
